<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASPEN HERITAGE — Фермерское хозяйство и питомник собак</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Cormorant Garamond (Serif) & Montserrat (Sans-Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    },
                    colors: {
                        telegram: '#24A1DE',
                        youtube: '#FF0000',
                        brandBg: '#F3EDE6',
                        brandDark: '#3A2820',
                    }
                }
            }
        }
    </script>

    <style>
        /* Настройка внешнего вида карты */
        #map-container {
            width: 100%;
            height: 520px;
            z-index: 10;
        }

        /* Декоративный орнамент снизу первого блока */
        .pattern-border {
            background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.15) 0, rgba(255, 255, 255, 0.15) 10px, transparent 0, transparent 20px);
        }

        /* Плавные эффекты для кнопок */
        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }
        .btn-hover:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="font-sans text-[#3A2820] bg-brandBg antialiased selection:bg-[#3A2820] selection:text-white min-h-screen flex flex-col">

    <!-- ==================== БЛОК 1: ГЛАВНЫЙ ЭКРАН (HERO SECTION) ==================== -->
    <section class="relative min-h-screen flex flex-col justify-between bg-cover bg-center bg-no-repeat overflow-hidden" 
             style="background-image: linear-gradient(180deg, rgba(35, 18, 8, 0.45) 0%, rgba(20, 10, 5, 0.6) 100%), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=2000&auto=format&fit=crop');">
        
        <!-- Шапка: Логотип слева и кнопка YouTube справа -->
        <header class="w-full max-w-7xl mx-auto px-6 pt-8 md:pt-10 flex justify-between items-start z-20">
            <!-- Логотип в две строки шрифтом с засечками -->
            <a href="#" class="inline-block group focus:outline-none">
                <div class="flex items-center gap-2 mb-1">
                    <!-- Небольшой ромбовидный символ в стиле логотипа -->
                    <span class="inline-block w-2.5 h-2.5 rotate-45 border border-white/80 bg-white/30"></span>
                    <h1 class="font-serif text-3xl md:text-5xl font-light tracking-wider text-white uppercase leading-tight drop-shadow-md group-hover:opacity-90 transition-opacity">
                        ASPEN<br/><span class="font-normal tracking-widest">HERITAGE</span>
                    </h1>
                </div>
            </a>

            <!-- Кнопка YouTube в правом верхнем углу (Красная как в оригинале) -->
            <a href="https://youtube.com/@aspen_heritage?si=hTkDpYstGlAHq1Dr" target="_blank" rel="noopener noreferrer" 
               class="btn-hover inline-flex items-center gap-2.5 bg-youtube hover:bg-red-600 text-white font-medium px-5 py-2.5 rounded-full shadow-lg backdrop-blur-sm transition-all focus:ring-2 focus:ring-red-400 focus:outline-none">
                <i class="fa-brands fa-youtube text-lg"></i>
                <span class="text-xs md:text-sm tracking-wide font-sans">YouTube</span>
            </a>
        </header>

        <!-- Центральный контент -->
        <main class="w-full max-w-7xl mx-auto px-6 py-12 md:py-20 flex-grow flex flex-col justify-center z-10">
            <div class="max-w-3xl">
                <!-- Главное название шрифтом без засечек (как в оригинале ТЗ) -->
                <h2 class="font-sans font-medium text-4xl sm:text-5xl md:text-6xl lg:text-7xl text-white leading-tight tracking-tight drop-shadow-lg mb-8">
                    Фермерское хозяйство и питомник собак
                </h2>

                <!-- Овальные рамки-теги (Овцы, Гуси, Утки, Куры, Ягдтерьеры) -->
                <div class="flex flex-wrap gap-2.5 md:gap-3 mb-10">
                    <span class="px-5 py-1.5 rounded-full border border-white/40 bg-black/20 backdrop-blur-md text-white/90 text-xs md:text-sm font-sans tracking-wide">
                        Овцы
                    </span>
                    <span class="px-5 py-1.5 rounded-full border border-white/40 bg-black/20 backdrop-blur-md text-white/90 text-xs md:text-sm font-sans tracking-wide">
                        Гуси
                    </span>
                    <span class="px-5 py-1.5 rounded-full border border-white/40 bg-black/20 backdrop-blur-md text-white/90 text-xs md:text-sm font-sans tracking-wide">
                        Утки
                    </span>
                    <span class="px-5 py-1.5 rounded-full border border-white/40 bg-black/20 backdrop-blur-md text-white/90 text-xs md:text-sm font-sans tracking-wide">
                        Куры
                    </span>
                    <span class="px-5 py-1.5 rounded-full border border-white/40 bg-black/20 backdrop-blur-md text-white/90 text-xs md:text-sm font-sans tracking-wide">
                        Ягдтерьеры
                    </span>
                </div>

                <!-- Кнопки снизу слева: Двустрочная кнопка телефона и Telegram -->
                <div class="flex flex-wrap items-center gap-4">
                    <!-- Кнопка Телефон (Позвонить + номер телефона) -->
                    <a href="tel:+375296666621" 
                       class="btn-hover inline-flex items-center gap-3.5 bg-white/95 hover:bg-white text-brandDark px-6 py-3 rounded-2xl shadow-xl transition-all border border-white/20">
                        <div class="w-9 h-9 rounded-full bg-brandDark/10 flex items-center justify-center flex-shrink-0">
                            <i class="fa-solid fa-phone text-brandDark text-sm"></i>
                        </div>
                        <div class="flex flex-col text-left">
                            <span class="text-[11px] uppercase tracking-wider font-semibold opacity-70 leading-none mb-1">Позвонить</span>
                            <span class="text-sm md:text-base font-bold font-sans tracking-tight leading-none">+375 29 666 66 21</span>
                        </div>
                    </a>

                    <!-- Кнопка Telegram (Голубая) -->
                    <a href="https://t.me/+375296666621" target="_blank" rel="noopener noreferrer"
                       class="btn-hover inline-flex items-center gap-3 bg-telegram hover:bg-[#1f93cc] text-white px-6 py-3.5 rounded-2xl shadow-xl transition-all font-sans font-medium text-sm md:text-base">
                        <i class="fa-brands fa-telegram text-xl"></i>
                        <span>Написать в Telegram</span>
                    </a>
                </div>
            </div>
        </main>

        <!-- Нижний декоративный паттерн орнамента -->
        <div class="w-full h-3 border-t border-white/20 pattern-border opacity-40"></div>
    </section>

    <!-- ==================== БЛОК 2: КАРТА И КОНТАКТЫ ==================== -->
    <section class="w-full bg-brandBg pt-12 pb-10 flex flex-col justify-between">
        <div class="w-full">
            <!-- Заголовок блока -->
            <div class="max-w-7xl mx-auto px-6 mb-6">
                <h3 class="font-serif text-3xl md:text-4xl text-brandDark tracking-wide font-normal">
                    Как к нам проехать
                </h3>
            </div>

            <!-- Прямоугольная карта на всю ширину экрана (100% Full Width) через Yandex Maps iFrame -->
            <div id="map-container" class="w-full relative shadow-inner border-y border-[#e2d7cb] overflow-hidden bg-[#e8e2d8]">
                <iframe 
                    src="https://yandex.ru/map-widget/v1/?ll=28.300111%2C54.303303&z=16&whatshere%5Bpoint%5D=28.300111%2C54.303303&whatshere%5Bzoom%5D=16" 
                    width="100%" 
                    height="100%" 
                    frameborder="0" 
                    allowfullscreen="true" 
                    style="position:relative; border:0;">
                </iframe>
            </div>

            <!-- Блок под картой: Почта и кнопки навигации -->
            <div class="max-w-7xl mx-auto px-6 pt-8 flex flex-col items-center text-center">
                
                <!-- Электронная почта (кликабельная) -->
                <div class="mb-8">
                    <span class="text-xs uppercase tracking-widest text-brandDark/60 block mb-1 font-medium">Электронная почта</span>
                    <a href="mailto:mail@heritage.by" 
                       class="font-sans text-xl md:text-2xl font-semibold text-brandDark hover:opacity-75 transition-opacity underline underline-offset-8 decoration-brandDark/30">
                        mail@heritage.by
                    </a>
                </div>

                <!-- Кнопки Яндекс Карты и Google Maps (отцентрированы) -->
                <div class="flex flex-wrap justify-center items-center gap-3 md:gap-4 mb-10 w-full max-w-lg">
                    <!-- Яндекс Карты с точной ссылкой локации -->
                    <a href="https://yandex.ru/maps?whatshere%5Bzoom%5D=18&whatshere%5Bpoint%5D=28.300111,54.303303&si=a0k00ax43cwfgry9wq2b63h124" 
                       target="_blank" rel="noopener noreferrer"
                       class="btn-hover flex-1 min-w-[200px] inline-flex items-center justify-center gap-2 border border-brandDark/40 hover:border-brandDark text-brandDark bg-transparent font-medium px-6 py-3 rounded-full text-xs md:text-sm tracking-wide transition-all">
                        <i class="fa-solid fa-location-dot text-red-700"></i>
                        <span>Маршрут в Яндекс Картах</span>
                    </a>

                    <!-- Google Maps -->
                    <a href="https://www.google.com/maps/search/?api=1&query=54.303303,28.300111" 
                       target="_blank" rel="noopener noreferrer"
                       class="btn-hover flex-1 min-w-[160px] inline-flex items-center justify-center gap-2 border border-brandDark/40 hover:border-brandDark text-brandDark bg-transparent font-medium px-6 py-3 rounded-full text-xs md:text-sm tracking-wide transition-all">
                        <i class="fa-brands fa-google text-blue-600"></i>
                        <span>Google Maps</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Подвал (Копирайт) -->
        <footer class="w-full border-t border-brandDark/10 pt-6 text-center">
            <p class="text-xs text-brandDark/50 font-sans tracking-wider uppercase">
                © ASPEN HERITAGE. Все права защищены.
            </p>
        </footer>
    </section>

</body>
</html>
